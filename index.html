  <!DOCTYPE html>
<html>
<head>
    <title>For Luyando ❤️</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #fff0f5);
            overflow: hidden;
        }

        .box {
            background: white;
            padding: 35px 25px;
            border-radius: 25px;
            width: 80%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff4f81;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
        }

        #start {
            background: #ff4f81;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>For Luyando ❤️</h1>

    <p>
        I made something special for you...
        🥹❤️
    </p>

    <button id="start" onclick="start()">Open my surprise 💌</button>

</div>

<script>

function start() {
    document.querySelector(".box").innerHTML = `
        <h1>Do you love me? ❤️</h1>

        <p>
            Be honest Luyando... 👀
        </p>

        <button onclick="yes()">YES ❤️</button>

        <button onclick="no()">
            NO 😭
        </button>
    `;
}

function yes() {
    alert("I knew it! 😭❤️");
}

function no() {
    alert("Hmmmm... try again 😭😂");
}

</script>

</body>
</html>
